name: ci

# Cost design: the jobs use the runner's preinstalled toolchain (GCC 13/14, Clang 18, CMake, Ninja) instead
# of building the Docker dev image, which cost ~3 min per job. The image is verified separately, only when
# docker/** changes (image.yml). Three jobs run in parallel (gcc, clang, tidy): wall-clock time is the slowest
# one (~3.5 min) instead of the sum; clang-tidy is its own job because it is not cacheable by ccache.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']

permissions:
  contents: read

env:
  # Cache compiled objects between runs: only files that changed are recompiled. GoogleTest and unchanged
  # modules are built once per cache key instead of once per run per configuration.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 400M
  CCACHE_COMPILERCHECK: content
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel a push to main

jobs:
  gcc:
    name: gcc (gates, dev, release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # a cold ccache plus the LTO link needs more than 10; two runs of 20 were cancelled in the LTO link (PR #52)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: ccache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ccache
          key: ccache-gcc-${{ github.sha }}
          restore-keys: ccache-gcc-
      - name: Toolchain
        run: |
          command -v ccache >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ccache; }
          dpkg -s libssl-dev >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libssl-dev; }   # TLS (ADR-0019)
          g++ --version | head -1
          cmake --version | head -1
          ninja --version
          clang-format-18 --version
          php --version | head -1   # the PHP binding tests (bindings/php) must run in CI, not be skipped
      - name: Quality gates
        run: |
          cmake --preset dev
          cmake --build --preset dev --target format-check check-banned check-includes header-check
      - name: dev (GCC, ASan+UBSan) and tool tests
        run: |
          cmake --build --preset dev
          ctest --preset dev
      - name: release (GCC, hardened, LTO)
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release
      - name: ccache statistics
        if: always()
        run: ccache --show-stats --verbose | head -12

  clang:
    name: clang (libc++, dev, tsan, fuzz)
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # dev, tsan and fuzz builds: 20 minutes was cancelled 16 s before the last step (PR #53)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: ccache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ccache
          key: ccache-clang-${{ github.sha }}
          restore-keys: ccache-clang-
      - name: Install libc++
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libc++-18-dev libc++abi-18-dev libclang-rt-18-dev ccache libssl-dev
          clang++-18 --version | head -1
          php --version | head -1   # the PHP binding tests (bindings/php) must run here too, not be skipped
      - name: dev-clang (ASan+UBSan)
        run: |
          cmake --preset dev-clang -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset dev-clang
          ctest --preset dev-clang
      - name: tsan
        run: |
          cmake --preset tsan -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset tsan
          ctest --preset tsan
      - name: fuzz (corpus replay + 5 s smoke per target)
        shell: bash   # bash -eo pipefail: a crash found by the fuzzer must fail the step, not be hidden by `| tail`
        run: |
          cmake --preset fuzz -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset fuzz --target fuzz_utf8 fuzz_base64 fuzz_sha1 fuzz_http_request fuzz_handshake fuzz_frame_parser fuzz_message_pipeline fuzz_session fuzz_ipc_frame fuzz_handshake_blob fuzz_tls_server fuzz_inflate
          ctest --test-dir build/fuzz -L fuzz-regression --output-on-failure
          for target in utf8 base64 sha1 http_request handshake frame_parser message_pipeline session ipc_frame handshake_blob tls_server inflate; do
            mkdir -p "$RUNNER_TEMP/fuzz_$target"
            "build/fuzz/tests/fuzz/fuzz_$target" "$RUNNER_TEMP/fuzz_$target" "tests/fuzz/corpus/$target" \
              -max_total_time=5 -artifact_prefix="$RUNNER_TEMP/" 2>&1 | tail -2
          done
      - name: ccache statistics
        if: always()
        run: ccache --show-stats --verbose | head -12

  tidy:
    name: clang-tidy (libc++)
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # tidy is not cacheable and grows with the test count; 20 was cancelled on PR #55 (and ran 19m52s on #52)
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ''   # tidy runs are not cacheable; ccache is not installed in this job
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install libc++ and clang-tidy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libc++-18-dev libc++abi-18-dev clang-tidy-18 libssl-dev
          clang-tidy-18 --version | head -2
      - name: clang-tidy
        run: |
          cmake --preset tidy -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset tidy
