name: ci

# Cost design: the jobs use the runner's preinstalled toolchain (GCC 13/14, Clang 18, CMake, Ninja) instead
# of building the Docker dev image, which cost ~3 min per job. The image is verified separately, only when
# docker/** changes (image.yml). Two jobs, not one per preset, to pay runner start-up twice, not five times.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel a push to main

jobs:
  gcc:
    name: gcc (gates, dev, release)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          g++ --version | head -1
          cmake --version | head -1
          ninja --version
          clang-format-18 --version
      - name: Quality gates
        run: |
          cmake --preset dev
          cmake --build --preset dev --target format-check check-banned check-includes header-check
      - name: dev (GCC, ASan+UBSan) and tool tests
        run: |
          cmake --build --preset dev
          ctest --preset dev
      - name: release (GCC, hardened, LTO)
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release

  clang:
    name: clang (libc++, dev, tsan, tidy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install libc++ and clang-tidy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libc++-18-dev libc++abi-18-dev clang-tidy-18
          clang++-18 --version | head -1
      - name: dev-clang (ASan+UBSan)
        run: |
          cmake --preset dev-clang -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset dev-clang
          ctest --preset dev-clang
      - name: tsan
        run: |
          cmake --preset tsan -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset tsan
          ctest --preset tsan
      - name: clang-tidy
        run: |
          cmake --preset tidy -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset tidy
