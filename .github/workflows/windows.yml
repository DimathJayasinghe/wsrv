name: windows

# wsrvd and libwsrv are Linux only (epoll, ADR-0004). A Windows developer runs the worker natively and
# reaches a daemon in Docker Desktop or WSL2 over the TCP IPC transport (ADR-0038), so what is checked
# here is the CLIENT side on a real Windows runner: the PHP client against a fake daemon over real
# loopback TCP (a child PHP process plays the daemon: pcntl_fork does not exist on Windows) and the
# worker above it. "It works on Windows" is the point of the feature; without this job it would be a
# claim. Not covered: the daemon itself and the Docker path (hosted Windows runners cannot run Linux
# containers), and the supervisor's signal handling (pcntl is Linux and macOS).
on:
  push:
    branches: [main, develop]
    paths: ['composer.json', 'bindings/php/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['composer.json', 'bindings/php/**', '.github/workflows/windows.yml']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  php:
    name: php ${{ matrix.php }} (Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', 'latest']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: The whole PHP suite (any notice or warning fails; tests that need pcntl, the daemon or libwsrv skip themselves)
        run: |
          php --version | head -1
          php bindings/php/tests/run.php 2>&1 | tee "$RUNNER_TEMP/php.log"
          grep -E '^[0-9]+ passed, 0 failed' "$RUNNER_TEMP/php.log"
      - name: Which tests skipped, and why
        run: grep '^SKIP' "$RUNNER_TEMP/php.log" || echo "nothing skipped"
      - name: The package installs with Composer on Windows and its autoloader works
        run: |
          # What `composer require wsrv/client` does for a Windows developer, from this checkout.
          consumer="$RUNNER_TEMP/consumer"
          mkdir "$consumer" && cd "$consumer"
          composer init --no-interaction --name=ci/consumer --stability=dev > /dev/null
          composer config repositories.wsrv --json "{\"type\":\"path\",\"url\":\"$(cygpath -m "$GITHUB_WORKSPACE")\",\"options\":{\"symlink\":false}}"
          composer require --no-interaction --no-progress "wsrv/client:@dev"
          php -r 'require "vendor/autoload.php"; exit(Wsrv\Client::isTcpEndpoint("tcp://127.0.0.1:9300") && class_exists(Wsrv\Supervisor::class) ? 0 : 1);'
          echo "installed and loaded"
