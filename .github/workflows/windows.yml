name: windows

# wsrvd and libwsrv are Linux only (epoll, ADR-0004). A Windows developer runs the worker natively and
# reaches a daemon in Docker Desktop or WSL2 over the TCP IPC transport (ADR-0038), so what is checked
# here is the CLIENT side on a real Windows runner: the PHP client against a fake daemon over real
# loopback TCP (a child PHP process plays the daemon: pcntl_fork does not exist on Windows) and the
# worker above it. "It works on Windows" is the point of the feature; without this job it would be a
# claim. Not covered: the daemon itself and the Docker path (hosted Windows runners cannot run Linux
# containers), and the supervisor's signal handling (pcntl is Linux and macOS).
on:
  push:
    branches: [main, develop]
    paths: ['composer.json', 'bindings/php/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['composer.json', 'bindings/php/**', '.github/workflows/windows.yml']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  php:
    name: php ${{ matrix.php }} (Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', 'latest']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: The client and the worker over TCP (any notice or warning fails; the fork-based test skips itself)
        run: |
          php --version | head -1
          for filter in 'client:' 'worker:'; do
            php bindings/php/tests/run.php "$filter" 2>&1 | tee "$RUNNER_TEMP/php.log"
            grep -E '^[0-9]+ passed, 0 failed' "$RUNNER_TEMP/php.log"
          done
