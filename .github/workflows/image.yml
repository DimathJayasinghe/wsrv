name: dev-image

# The Docker dev image is the local development environment. CI builds it only when it can have changed.
on:
  push:
    branches: [main]
    paths: ['docker/**', 'docker-compose.yml', '.github/actions/dev-env/**', '.github/workflows/image.yml']
  pull_request:
    paths: ['docker/**', 'docker-compose.yml', '.github/actions/dev-env/**', '.github/workflows/image.yml']

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-env
      - name: Image smoke test (toolchain + a full build and test inside it)
        run: |
          tools/ci-run.sh 'g++ --version | head -1 && clang++ --version | head -1 && cmake --version | head -1'
          tools/ci-run.sh 'cmake --preset dev && cmake --build --preset dev && ctest --preset dev'
