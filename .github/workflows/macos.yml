name: macos

# wsrvd and libwsrv are Linux only (they are built on epoll: ADR-0004, docs/RELEASE.md section 3). A Mac
# developer runs the CLIENT side natively, so that is what is checked here, on Apple Silicon (macos-15):
#   * the PHP package (bindings/php): its whole test suite, on the PHP floor and the latest PHP. The tests
#     that need the daemon or libwsrv.so skip themselves; everything else (the frame decoder, the client
#     against a fake daemon over a Unix socket, the publisher, the supervisor, the install helper) runs.
#   * the install helper as the real command: on a Mac it must refuse and say what to do, not write a Linux
#     library (on Apple Silicon php_uname('m') is "arm64", which it maps to aarch64).
#   * the JavaScript client (clients/js) on Node 22.
# Not covered, and why: the Docker path (hosted macOS runners have no Docker and no nested virtualization)
# and the Intel Mac. The C++ server is not built here; the last job only measures how far from building it is.
on:
  push:
    branches: [main, develop]
    paths: ['composer.json', 'bindings/php/**', 'clients/js/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['composer.json', 'bindings/php/**', 'clients/js/**', '.github/workflows/macos.yml']

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash   # -eo pipefail: a failing test run is not hidden by `| tee`

jobs:
  php:
    name: php ${{ matrix.php }} (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', 'latest']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: The test suite (daemon-dependent tests skip themselves; any notice or warning fails)
        run: |
          php --version | head -1
          uname -sm
          php bindings/php/tests/run.php 2>&1 | tee "$RUNNER_TEMP/php.log"
          grep -E '^[0-9]+ passed, 0 failed' "$RUNNER_TEMP/php.log"
      - name: Which tests skipped, and why
        run: grep '^SKIP' "$RUNNER_TEMP/php.log" || echo "nothing skipped"
      - name: The install helper refuses on a Mac and writes nothing
        run: |
          mkdir "$RUNNER_TEMP/lib-dir"
          set +e
          out="$(php bindings/php/bin/wsrv-install-lib --dir="$RUNNER_TEMP/lib-dir/wsrv-lib" 2>&1)"
          code=$?
          set -e
          echo "exit $code: $out"
          [ "$code" -eq 1 ]
          echo "$out" | grep -q 'Darwin'
          echo "$out" | grep -q 'Linux only'
          [ -z "$(ls -A "$RUNNER_TEMP/lib-dir")" ]

  javascript:
    name: JavaScript client (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: The client's tests (the interop test needs wsrvd and skips itself)
        working-directory: clients/js
        run: |
          node --version
          npm test 2>&1 | tee "$RUNNER_TEMP/js.log" | tail -25

  how-far-is-a-native-build:
    # A measurement, not a gate: it never fails the workflow. It compiles every target of the C++ project
    # with Apple clang and reports which modules build, so a macOS port (kqueue, milestone M13) starts from a
    # fact. The result is in the job summary.
    name: C++ build probe (macOS, informational)
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          clang++ --version | head -1
          cmake --version | head -1
          command -v ninja >/dev/null || brew install ninja
      - name: Configure
        id: configure
        run: |
          set +e
          cmake -S . -B build/mac -G Ninja -DCMAKE_BUILD_TYPE=Release -DWSRV_BUILD_TESTS=OFF \
            -DWSRV_ENABLE_TLS=OFF -DWSRV_ENABLE_DEFLATE=OFF -DWSRV_WARNINGS_AS_ERRORS=OFF 2>&1 | tee "$RUNNER_TEMP/configure.log"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Build everything that builds
        if: steps.configure.outputs.status == '0'
        run: |
          set +e
          cmake --build build/mac -- -k 0 > "$RUNNER_TEMP/build.log" 2>&1
          echo "ninja exit $?"
          true
      - name: Report
        if: always()
        run: |
          {
            echo "### C++ build probe on macOS (Apple clang, TLS and deflate off)"
            echo
            echo "configure exit: ${{ steps.configure.outputs.status }}"
            if [ "${{ steps.configure.outputs.status }}" != 0 ]; then
              echo; echo '```'; tail -15 "$RUNNER_TEMP/configure.log"; echo '```'
            else
              echo; echo "targets that failed to compile, by source directory:"; echo '```'
              awk '/^FAILED:/ { if (match($0, /(src|apps|tests)\/[a-z_]+/)) print substr($0, RSTART, RLENGTH); else print "other" }' "$RUNNER_TEMP/build.log" | sort | uniq -c | sort -rn
              echo '```'; echo "first errors:"; echo '```'
              grep -E 'error:' "$RUNNER_TEMP/build.log" | sort | uniq -c | sort -rn | head -12 | cut -c1-220
              echo '```'; echo "last lines:"; echo '```'; tail -3 "$RUNNER_TEMP/build.log"; echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
