name: container

# The wsrvd image (docker/wsrvd.Dockerfile) must keep three promises: it starts from environment
# variables alone (ADR-0030), `docker ps` reports it healthy (the HEALTHCHECK runs `wsrvd
# --healthcheck`), and a mistyped WSRVD_ variable stops it instead of starting a weaker server.
# Runs only when the image or what goes into it changes; one native build, about five minutes.
on:
  push:
    branches: [main, develop]
    paths: ['docker/wsrvd.Dockerfile', 'apps/wsrvd/**', 'src/**', 'include/**', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**', '.github/workflows/container.yml']
  pull_request:
    paths: ['docker/wsrvd.Dockerfile', 'apps/wsrvd/**', 'src/**', 'include/**', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**', '.github/workflows/container.yml']

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -f docker/wsrvd.Dockerfile -t wsrvd:ci .
      - name: Starts from the environment and becomes healthy
        run: |
          docker run -d --name wsrvd-env \
            -e WSRVD_ALLOW_ORIGIN=https://a.example,https://b.example \
            -e WSRVD_MAX_CONNECTIONS_PER_IP=7 \
            wsrvd:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' wsrvd-env)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health after wait: $status"
          docker logs wsrvd-env
          [ "$status" = healthy ]
      - name: The daemon says what it is doing, one structured line per event (ADR-0037)
        run: |
          logs="$(docker logs wsrvd-env 2>&1)"
          echo "$logs" | grep -Eq '^ts=[0-9T:.Z-]+ level=info event=ipc_ready msg="'
          echo "$logs" | grep -Eq '^ts=[0-9T:.Z-]+ level=info event=listening msg="'
          # Every line on stderr is a log line: nothing unstructured has crept back in.
          ! echo "$logs" | grep -Ev '^ts=[0-9T:.Z-]+ level=(error|warn|info|debug) event=[a-z_]+ ' | grep .
      - name: Reports unhealthy once the daemon is gone
        run: |
          # The probe is the binary's own mode: ask it directly with the container's environment.
          docker exec wsrvd-env /usr/local/bin/wsrvd --healthcheck
          docker kill wsrvd-env
          ! docker run --rm -e WSRVD_IPC_SOCKET=/nonexistent/ipc.sock wsrvd:ci --healthcheck
      - name: The TCP IPC transport (ADR-0038) is chosen by the environment alone and needs its token
        run: |
          token="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"   # 48 hex characters
          echo "::add-mask::$token"
          docker volume create wsrv-ci-secret >/dev/null
          # The token file keeps its rules (mode 0600, owned by the daemon's uid 10001): the volume is
          # prepared as root, the way the Kubernetes manifest's init container does it.
          docker run --rm --user 0 --entrypoint sh -v wsrv-ci-secret:/s -e T="$token" wsrvd:ci -c \
            'printf %s "$T" > /s/ipc.token && chown 10001:10001 /s/ipc.token && chmod 0600 /s/ipc.token'
          # Only the port is chosen: the image has no WSRVD_IPC_SOCKET set, so there is no "both" error.
          docker run -d --name wsrvd-tcp -p 127.0.0.1:19300:9300 -v wsrv-ci-secret:/run/secrets:ro \
            -e WSRVD_IPC_PORT=9300 -e WSRVD_IPC_HOST=0.0.0.0 \
            -e WSRVD_IPC_TOKEN_FILE=/run/secrets/ipc.token wsrvd:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' wsrvd-tcp)" = healthy ] && break
            sleep 2
          done
          logs="$(docker logs wsrvd-tcp 2>&1)"
          echo "$logs"
          [ "$(docker inspect -f '{{.State.Health.Status}}' wsrvd-tcp)" = healthy ]
          echo "$logs" | grep -Eq 'event=ipc_ready msg="wsrvd: ipc tcp 0\.0\.0\.0:9300 ready"'
          echo "$logs" | grep -Eq 'level=warn event=ipc_plaintext '   # not loopback: said out loud
          ! echo "$logs" | grep -q 'event=ipc_no_token'               # TCP always has a token
          # From the host, through the published port: the right token is welcome, the wrong one is not.
          python3 - "$token" <<'PY'
          import socket, struct, sys
          def hello(token):
              body = struct.pack(">HHH", 0, 3, len(token)) + token
              return struct.pack(">IBB", 2 + len(body), 1, 0) + body
          def first_frame_type(token):
              with socket.create_connection(("127.0.0.1", 19300), timeout=5) as s:
                  s.sendall(hello(token))
                  data = s.recv(64)
                  return struct.unpack(">IBB", data[:6])[1]
          good = first_frame_type(sys.argv[1].encode())
          bad = first_frame_type(b"x" * 48)
          print("right token: frame type", good, "(2 = HELLO_OK); wrong token: frame type", bad, "(9 = STATUS)")
          assert good == 2 and bad == 9
          PY
          docker kill wsrvd-tcp >/dev/null
      - name: Both transports at once, or a TCP port without a token, stop the start
        run: |
          set +e
          out=$(docker run --rm -e WSRVD_IPC_PORT=9300 -e WSRVD_IPC_SOCKET=/run/wsrv/ipc.sock \
                  -e WSRVD_IPC_TOKEN_FILE=/nonexistent wsrvd:ci 2>&1)
          code=$?
          echo "$out" | head -3
          [ "$code" -ne 0 ] || exit 1
          echo "$out" | grep -q ipc_socket || exit 1
          echo "$out" | grep -q ipc_port || exit 1
          out=$(docker run --rm -e WSRVD_IPC_PORT=9300 wsrvd:ci 2>&1)
          code=$?
          echo "$out" | head -3
          [ "$code" -ne 0 ] || exit 1
          echo "$out" | grep -q ipc_token_file
      - name: The log level is honoured and a misspelled one stops the start
        run: |
          docker run -d --name wsrvd-quiet -e WSRVD_LOG_LEVEL=warn wsrvd:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' wsrvd-quiet)" = healthy ] && break
            sleep 2
          done
          quiet="$(docker logs wsrvd-quiet 2>&1)"
          echo "at warn level: $quiet"
          echo "$quiet" | grep -q 'event=ipc_no_token'      # a warning is still said
          ! echo "$quiet" | grep -q 'event=listening'       # info is not
          docker kill wsrvd-quiet
          set +e
          out=$(docker run --rm -e WSRVD_LOG_LEVEL=loud wsrvd:ci 2>&1)
          code=$?
          echo "$out" | head -3
          [ "$code" -ne 0 ]
          echo "$out" | grep -q WSRVD_LOG_LEVEL
      - name: A mistyped WSRVD_ variable stops the start and names itself
        run: |
          set +e
          out=$(docker run --rm -e WSRVD_ALLOW_ORIGINS=https://a.example wsrvd:ci 2>&1)
          code=$?
          echo "$out" | head -5
          [ "$code" -ne 0 ]
          echo "$out" | grep -q WSRVD_ALLOW_ORIGINS
